name: CD (release)

on:
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────
  # Job 1: Build
  # ────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Install dependencies
        run: nix develop -c pnpm install

      - name: Build
        run: nix develop -c pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ────────────────────────────────────────
  # Job 2: Deploy to production
  # ────────────────────────────────────────
  deploy:
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ────────────────────────────────────────
  # Job 3: System Test (Playwright)
  # ────────────────────────────────────────
  system-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Install dependencies
        run: nix develop -c pnpm install

      - name: Install Playwright browsers
        run: nix develop -c pnpm exec playwright install --with-deps chromium

      - name: Run system tests against deployed site
        run: nix develop -c pnpm run test:system
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # ────────────────────────────────────────
  # Job 4: Rollback on failure
  # ────────────────────────────────────────
  rollback:
    runs-on: ubuntu-latest
    needs: [build, deploy, system-test]
    if: failure()
    steps:
      - name: Revert release to draft
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseId = context.payload.release.id;
            const tag = context.payload.release.tag_name;

            core.warning(`Deployment failed. Reverting release ${tag} to draft.`);

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              draft: true,
            });

            core.summary.addRaw([
              '## ⚠️ Release Reverted to Draft',
              '',
              `Release **${tag}** has been reverted to draft due to deployment failure.`,
              'Please investigate the failure, fix the issue, and re-publish the release.',
            ].join('\n'));
            await core.summary.write();

  # ────────────────────────────────────────
  # Job 5: Notification (Summary)
  # ────────────────────────────────────────
  notification:
    runs-on: ubuntu-latest
    needs: [build, deploy, system-test]
    if: always()
    steps:
      - name: CD Release Result Summary
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = ${{ toJSON(needs) }};
            const tag = context.payload.release.tag_name;
            const results = Object.entries(jobs).map(([name, job]) => {
              const icon = job.result === 'success' ? '✅' : job.result === 'skipped' ? '⏭️' : '❌';
              return `| ${name} | ${icon} ${job.result} |`;
            });

            const allPassed = Object.values(jobs).every(j => j.result === 'success');

            const summary = [
              `## CD Release Pipeline Results — ${tag}`,
              '',
              '| Job | Status |',
              '|-----|--------|',
              ...results,
              '',
              `**Overall**: ${allPassed ? '✅ Release deployed successfully' : '❌ Release deployment failed — release reverted to draft'}`,
            ].join('\n');

            await core.summary.addRaw(summary).write();

      - name: Fail if any job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
