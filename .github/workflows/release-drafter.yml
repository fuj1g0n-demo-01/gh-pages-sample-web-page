name: Release Drafter

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Update or create draft release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // ── 1. Find existing draft release ──
            const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 10 });
            let draft = releases.data.find(r => r.draft);

            // ── 2. Collect merged PRs since last release ──
            const latestPublished = releases.data.find(r => !r.draft && !r.prerelease);
            const since = latestPublished?.published_at ?? new Date(0).toISOString();

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              base: 'main',
              per_page: 100,
            });

            const merged = pulls.filter(
              pr => pr.merged_at && new Date(pr.merged_at) > new Date(since)
            );

            // ── 3. Categorize PRs by labels ──
            const categories = {
              '🚀 Features': ['feature', 'enhancement'],
              '🐛 Bug Fixes': ['fix', 'bugfix', 'bug'],
              '📚 Documentation': ['documentation', 'docs'],
              '🧰 Maintenance': ['chore', 'maintenance', 'dependencies'],
            };

            const categorized = {};
            const uncategorized = [];

            for (const pr of merged) {
              const prLabels = pr.labels.map(l => l.name);
              let placed = false;
              for (const [category, labels] of Object.entries(categories)) {
                if (prLabels.some(l => labels.includes(l))) {
                  if (!categorized[category]) categorized[category] = [];
                  categorized[category].push(pr);
                  placed = true;
                  break;
                }
              }
              if (!placed) uncategorized.push(pr);
            }

            // ── 4. Build release body ──
            let body = '## What\'s Changed\n\n';

            for (const [category, prs] of Object.entries(categorized)) {
              body += `### ${category}\n\n`;
              for (const pr of prs) {
                body += `- ${pr.title} @${pr.user.login} (#${pr.number})\n`;
              }
              body += '\n';
            }

            if (uncategorized.length > 0) {
              body += '### Other Changes\n\n';
              for (const pr of uncategorized) {
                body += `- ${pr.title} @${pr.user.login} (#${pr.number})\n`;
              }
              body += '\n';
            }

            if (merged.length === 0) {
              body += '- No changes\n';
            }

            // ── 5. Determine next version ──
            const currentTag = latestPublished?.tag_name ?? 'v0.0.0';
            const match = currentTag.match(/v?(\d+)\.(\d+)\.(\d+)/);
            let [major, minor, patch] = match ? [+match[1], +match[2], +match[3]] : [0, 0, 0];

            const allLabels = merged.flatMap(pr => pr.labels.map(l => l.name));
            if (allLabels.includes('major')) {
              major++; minor = 0; patch = 0;
            } else if (allLabels.some(l => ['minor', 'feature', 'enhancement'].includes(l))) {
              minor++; patch = 0;
            } else {
              patch++;
            }

            const nextTag = `v${major}.${minor}.${patch}`;

            // ── 6. Create or update draft release ──
            if (draft) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: draft.id,
                tag_name: nextTag,
                name: nextTag,
                body,
                draft: true,
              });
              core.info(`Updated draft release: ${nextTag} (id: ${draft.id})`);
            } else {
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: nextTag,
                name: nextTag,
                body,
                draft: true,
              });
              core.info(`Created draft release: ${nextTag}`);
            }
