name: Test

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.14.0

      - name: Install dependencies
        run: devbox run -- pnpm install

      - name: Lint
        run: devbox run -- pnpm run lint

      - name: Build
        run: devbox run -- pnpm run build
